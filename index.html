<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MONO</title>
  
    <link rel="icon" type="image/jpeg" href="https://static.vecteezy.com/system/resources/previews/076/316/072/large_2x/vibrant-purple-logo-with-star-and-rocket-vector.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- ===== PRIVATE SCREEN ===== -->
    <div id="privateScreen" class="private-screen">
        <i class="fa-solid fa-lock padlock-icon"></i>
        <h1>This app is private.</h1>
        <p>This app is only available for authorised users.</p>
    </div>

    <!-- ===== WELCOME SCREEN ===== -->
    <div id="welcomeScreen" class="welcome-screen">
        <h1>Welcome back, Aiden.</h1>
    </div>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <button class="nav-item" id="gamesNavBtn">
            <i class="fa-solid fa-gamepad"></i>
            <span>Games</span>
        </button>
        <button class="nav-item" id="searchNavBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </button>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="mainContent">
        <!-- GAMES SECTION -->
        <div id="gamesSection" class="section-page active">
            <div class="credit-text games-credit">Made by Aiden</div>
            <div class="section-title">
                <i class="fa-solid fa-gamepad"></i>
                <span>Games</span>
            </div>
            <input type="text" id="gameSearchBar" class="search-bar" placeholder="Search games...">

            <!-- CONTINUE -->
            <div id="continueSubSection">
                <div class="sub-section-title">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Continue Playing</span>
                </div>
                <div class="games-grid" id="continueGrid"></div>
                <p id="continueEmpty" class="empty-message">No recently played games. Start playing to see them here!</p>
            </div>

            <!-- FAVORITES -->
            <div id="favoritesSubSection">
                <div class="sub-section-title">
                    <i class="fa-solid fa-star"></i>
                    <span>Favorites</span>
                </div>
                <div class="games-grid" id="favoritesGrid"></div>
                <p id="favoritesEmpty" class="empty-message">No favorites yet. Star a game to add it!</p>
            </div>

            <!-- ALL GAMES -->
            <div id="allGamesSubSection">
                <div class="sub-section-title">
                    <i class="fa-solid fa-list"></i>
                    <span>All Games</span>
                </div>
                <div class="games-grid" id="gamesGrid"></div>
            </div>
        </div>

        <!-- SEARCH SECTION (full page iframe) -->
        <div id="searchSection" class="section-page">
            <div class="search-iframe-container" id="searchIframeContainer">
                <iframe id="searchIframe" src="https://s3.amazonaws.com/angelfern/index.html" title="Proxy" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <!-- ===== FULL SCREEN GAME VIEW ===== -->
    <div id="gameScreen" class="game-screen">
        <div class="game-header">
            <span class="game-title" id="gameTitle">Game</span>
            <div class="game-actions">
                <button class="back-btn" id="backBtn">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
                <button class="fullscreen-btn" id="fullscreenBtn">
                    <i class="fa-solid fa-expand"></i> Fullscreen
                </button>
            </div>
        </div>
        <div class="iframe-container" id="iframeContainer">
            <div id="gameSpinner" class="spinner-overlay">
                <div class="spinner"></div>
                <p>Loading game...</p>
            </div>
            <iframe id="gameIframe" src="" title="Game frame" allowfullscreen></iframe>
        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="games-list.js"></script>
    <script>
        (function() {
            // ---------- DATA ----------
            const DEFAULT_GAMES = [
                { name: "Chess", url: "https://lichess.org/embed/board?theme=auto&bg=auto", category: "Strategy", description: "Classic board game of strategic thinking" },
                { name: "Snake", url: "https://www.google.com/logos/fnbx/snake_game/play.html", category: "Arcade", description: "Eat food and grow without hitting walls" },
                { name: "Pacman", url: "https://www.google.com/logos/2010/pacman10-i.html", category: "Arcade", description: "Navigate mazes and avoid ghosts" },
                { name: "Tetris", url: "https://tetris.com/play-tetris", category: "Puzzle", description: "Stack falling blocks to clear lines" },
                { name: "Solitaire", url: "https://worldofsolitaire.com/", category: "Card", description: "Classic card game of strategy and patience" },
                { name: "Minesweeper", url: "https://minesweeper.online/", category: "Puzzle", description: "Clear the board without hitting mines" }
            ];

            function extractGamesList() {
                try {
                    if (typeof GamesData !== 'undefined' && Array.isArray(GamesData) && GamesData.length > 0) {
                        return GamesData;
                    }
                } catch (e) {}
                if (typeof window.GamesData !== 'undefined' && Array.isArray(window.GamesData) && window.GamesData.length > 0) {
                    return window.GamesData;
                }
                if (typeof window.GAMES_LIST !== 'undefined' && Array.isArray(window.GAMES_LIST) && window.GAMES_LIST.length > 0) {
                    return window.GAMES_LIST;
                }
                try {
                    if (typeof games !== 'undefined' && Array.isArray(games) && games.length > 0) {
                        return games;
                    }
                } catch (e) {}
                return DEFAULT_GAMES;
            }

            function sanitizeGameData(rawList) {
                return rawList.map(function(game) {
                    return {
                        name: game.name || game.title || 'Untitled Game',
                        url: game.url || '',
                        category: game.category || 'Uncategorized',
                        description: game.description || 'No description available'
                    };
                });
            }

            let allGames = sanitizeGameData(extractGamesList());
            let filteredGames = [...allGames];

            // ---------- STORAGE HELPERS ----------
            function getStorage(key, fallback) {
                try {
                    const data = localStorage.getItem('mono_' + key);
                    return data ? JSON.parse(data) : fallback;
                } catch { return fallback; }
            }

            function setStorage(key, value) {
                try {
                    localStorage.setItem('mono_' + key, JSON.stringify(value));
                } catch {}
            }

            // ---------- STATE ----------
            let favorites = getStorage('favorites', []);
            let continueHistory = getStorage('continue', []);
            let currentGame = null;
            const MAX_CONTINUE = 8;

            // ---------- DOM REFS ----------
            const gamesGrid = document.getElementById('gamesGrid');
            const favoritesGrid = document.getElementById('favoritesGrid');
            const continueGrid = document.getElementById('continueGrid');
            const favoritesEmpty = document.getElementById('favoritesEmpty');
            const continueEmpty = document.getElementById('continueEmpty');
            const gameScreen = document.getElementById('gameScreen');
            const gameTitle = document.getElementById('gameTitle');
            const gameIframe = document.getElementById('gameIframe');
            const iframeContainer = document.getElementById('iframeContainer');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const backBtn = document.getElementById('backBtn');
            const gameSpinner = document.getElementById('gameSpinner');
            const searchIframe = document.getElementById('searchIframe');
            const gamesSection = document.getElementById('gamesSection');
            const searchSection = document.getElementById('searchSection');
            const gamesNavBtn = document.getElementById('gamesNavBtn');
            const searchNavBtn = document.getElementById('searchNavBtn');
            const mainContent = document.getElementById('mainContent');
            const gameSearchBar = document.getElementById('gameSearchBar');
            const privateScreen = document.getElementById('privateScreen');
            const welcomeScreen = document.getElementById('welcomeScreen');

            // ---------- ACCESS CONTROL ----------
            let isAuthorized = false;
            let keySequence = [];
            const requiredSequence = ['ArrowLeft', 'ArrowUp', 'ArrowUp', 'ArrowDown'];

            const ACCESS_KEY = "SofDjds2i12qj";
            const ACCESS_KEY_ALT = "oLfak1idma8InB";

            function grantAccess(welcomeMsg) {
                isAuthorized = true;
                privateScreen.classList.add('hidden');
                document.querySelector('#welcomeScreen h1').textContent = welcomeMsg;
                welcomeScreen.classList.add('active');
                setTimeout(() => {
                    welcomeScreen.classList.remove('active');
                }, 2000);
            }

            function promptAccessKey(callback) {
                const key = prompt("Enter Access Key String:");
                if (key === ACCESS_KEY || key === ACCESS_KEY_ALT) {
                    const welcomeMsg = (key === ACCESS_KEY) ? "Welcome back, Aiden." : "Welcome back, Sam.";
                    callback(welcomeMsg);
                } else {
                    location.reload();
                }
            }

            document.addEventListener('keydown', function(e) {
                if (isAuthorized) return;
                keySequence.push(e.key);
                if (keySequence.length > requiredSequence.length) keySequence.shift();
                if (keySequence.length === requiredSequence.length) {
                    if (requiredSequence.every((key, i) => keySequence[i] === key)) {
                        promptAccessKey(function(welcomeMsg) {
                            grantAccess(welcomeMsg);
                        });
                    }
                }
            });

            // ---------- SPINNER HELPERS ----------
            function showSpinner(spinner) {
                if (spinner) spinner.classList.remove('hidden');
            }

            function hideSpinner(spinner) {
                if (spinner) spinner.classList.add('hidden');
            }

            // ---------- IFRAME LOADING ----------
            gameIframe.addEventListener('load', function() {
                hideSpinner(gameSpinner);
            });

            // ---------- HELPER: Get full game data ----------
            function getFullGameData(game) {
                // Try to find the game in allGames by URL first, then by name
                let fullGame = allGames.find(g => g.url === game.url);
                if (!fullGame) {
                    fullGame = allGames.find(g => g.name === game.name);
                }
                if (fullGame) {
                    return {
                        name: fullGame.name,
                        url: fullGame.url,
                        category: fullGame.category || 'Uncategorized',
                        description: fullGame.description || 'No description available'
                    };
                }
                // Fallback: return the game with defaults
                return {
                    name: game.name || 'Untitled Game',
                    url: game.url || '',
                    category: game.category || 'Uncategorized',
                    description: game.description || 'No description available'
                };
            }

            // ---------- CREATE GAME TILE ----------
            function createGameTile(game, index) {
                // Ensure game has all required fields
                const fullGame = getFullGameData(game);
                
                const tile = document.createElement('div');
                tile.className = 'game-tile slide-in';
                tile.style.animationDelay = (index * 15) + 'ms';

                // Favorite button (top-left, smaller)
                const favBtn = document.createElement('button');
                favBtn.className = 'tile-fav-btn';
                const isFaved = favorites.some(g => g.url === fullGame.url);
                favBtn.innerHTML = isFaved ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
                favBtn.title = isFaved ? 'Remove from favorites' : 'Add to favorites';
                favBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleFavorite(fullGame);
                });
                tile.appendChild(favBtn);

                // Game info container
                const infoContainer = document.createElement('div');
                infoContainer.className = 'tile-info';

                // Game name
                const titleSpan = document.createElement('span');
                titleSpan.className = 'game-title-text';
                titleSpan.textContent = fullGame.name;
                infoContainer.appendChild(titleSpan);

                // Category tag
                const categorySpan = document.createElement('span');
                categorySpan.className = 'game-category';
                categorySpan.textContent = fullGame.category;
                categorySpan.setAttribute('data-category', fullGame.category);
                infoContainer.appendChild(categorySpan);

                // Description
                const descSpan = document.createElement('span');
                descSpan.className = 'game-description';
                descSpan.textContent = fullGame.description;
                infoContainer.appendChild(descSpan);

                tile.appendChild(infoContainer);

                tile.addEventListener('click', function() {
                    openGameScreen(fullGame);
                });

                return tile;
            }

            // ---------- TOGGLE FAVORITE ----------
            function toggleFavorite(game) {
                const fullGame = getFullGameData(game);
                const idx = favorites.findIndex(g => g.url === fullGame.url);
                if (idx > -1) {
                    favorites.splice(idx, 1);
                } else {
                    favorites.push({ 
                        name: fullGame.name, 
                        url: fullGame.url, 
                        category: fullGame.category, 
                        description: fullGame.description 
                    });
                }
                setStorage('favorites', favorites);
                renderFavorites();
                refreshAllGameStars();
                renderContinue();
            }

            // ---------- REFRESH STARS ----------
            function refreshAllGameStars() {
                const allTiles = gamesGrid.querySelectorAll('.game-tile');
                allTiles.forEach(tile => {
                    const favBtn = tile.querySelector('.tile-fav-btn');
                    if (favBtn) {
                        const gameName = tile.querySelector('.game-title-text')?.textContent || '';
                        const game = allGames.find(g => g.name === gameName);
                        if (game) {
                            const isFaved = favorites.some(g => g.url === game.url);
                            favBtn.innerHTML = isFaved ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>';
                            favBtn.title = isFaved ? 'Remove from favorites' : 'Add to favorites';
                        }
                    }
                });
            }

            // ---------- RENDER FUNCTIONS ----------
            function renderAllGames() {
                gamesGrid.innerHTML = '';
                
                if (filteredGames.length === 0) {
                    gamesGrid.innerHTML = '<p class="empty-message">No games found.</p>';
                    return;
                }

                requestAnimationFrame(() => {
                    const fragment = document.createDocumentFragment();
                    filteredGames.forEach((game, index) => {
                        const tile = createGameTile(game, index);
                        fragment.appendChild(tile);
                    });
                    gamesGrid.appendChild(fragment);
                });
            }

            function renderFavorites() {
                favoritesGrid.innerHTML = '';
                if (favorites.length === 0) {
                    favoritesEmpty.style.display = 'block';
                    return;
                }
                favoritesEmpty.style.display = 'none';
                requestAnimationFrame(() => {
                    const fragment = document.createDocumentFragment();
                    favorites.forEach((game, index) => {
                        const tile = createGameTile(game, index);
                        fragment.appendChild(tile);
                    });
                    favoritesGrid.appendChild(fragment);
                });
            }

            function renderContinue() {
                continueGrid.innerHTML = '';
                const displayHistory = continueHistory.slice(0, MAX_CONTINUE);
                
                if (displayHistory.length === 0) {
                    continueEmpty.style.display = 'block';
                    return;
                }
                continueEmpty.style.display = 'none';
                requestAnimationFrame(() => {
                    const fragment = document.createDocumentFragment();
                    displayHistory.forEach((game, index) => {
                        const tile = createGameTile(game, index);
                        fragment.appendChild(tile);
                    });
                    continueGrid.appendChild(fragment);
                });
            }

            function renderAll() {
                renderAllGames();
                renderFavorites();
                renderContinue();
            }

            // ---------- SEARCH FILTER ----------
            gameSearchBar.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                if (query === '') {
                    filteredGames = [...allGames];
                } else {
                    filteredGames = allGames.filter(g => 
                        g.name.toLowerCase().includes(query) ||
                        g.category.toLowerCase().includes(query) ||
                        g.description.toLowerCase().includes(query)
                    );
                }
                renderAllGames();
                document.getElementById('favoritesSubSection').style.display = query ? 'none' : 'block';
                document.getElementById('continueSubSection').style.display = query ? 'none' : 'block';
            });

            // ---------- OPEN / CLOSE GAME ----------
            function openGameScreen(game) {
                if (!game || !game.url) {
                    alert('This game has no valid link.');
                    return;
                }
                const fullGame = getFullGameData(game);
                currentGame = fullGame;
                gameTitle.textContent = fullGame.name;
                showSpinner(gameSpinner);
                gameIframe.src = fullGame.url;
                gameScreen.classList.add('active');
                document.body.style.overflow = 'hidden';

                continueHistory = continueHistory.filter(g => g.url !== fullGame.url);
                continueHistory.unshift({ 
                    name: fullGame.name, 
                    url: fullGame.url, 
                    category: fullGame.category,
                    description: fullGame.description
                });
                if (continueHistory.length > MAX_CONTINUE) {
                    continueHistory = continueHistory.slice(0, MAX_CONTINUE);
                }
                setStorage('continue', continueHistory);
                renderContinue();

                setTimeout(() => {
                    gameIframe.src = fullGame.url;
                }, 20);
            }

            function closeGameScreen() {
                gameScreen.classList.remove('active');
                gameIframe.src = 'about:blank';
                gameSpinner.classList.add('hidden');
                document.body.style.overflow = '';
                currentGame = null;
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
            }

            backBtn.addEventListener('click', closeGameScreen);

            // ---------- FULLSCREEN (on iframe only) ----------
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    if (iframeContainer.requestFullscreen) {
                        iframeContainer.requestFullscreen().catch(() => {});
                    } else if (iframeContainer.webkitRequestFullscreen) {
                        iframeContainer.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
            fullscreenBtn.addEventListener('click', toggleFullscreen);

            // ---------- SECTION NAVIGATION ----------
            let currentSection = 'games';

            function showSection(section) {
                document.querySelectorAll('.section-page').forEach(el => {
                    el.classList.remove('active');
                });

                if (section === 'games') {
                    gamesSection.classList.add('active');
                } else if (section === 'search') {
                    searchSection.classList.add('active');
                }

                currentSection = section;

                if (gameScreen.classList.contains('active')) {
                    closeGameScreen();
                }
            }

            gamesNavBtn.addEventListener('click', function() { showSection('games'); });
            searchNavBtn.addEventListener('click', function() { showSection('search'); });

            // ---------- KEYBOARD SHORTCUTS ----------
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'g') {
                    e.preventDefault();
                    showSection('games');
                }
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    showSection('search');
                }
                if (e.key === 'Escape' && gameScreen.classList.contains('active')) {
                    closeGameScreen();
                }
                if (e.key === 'f' && !e.ctrlKey && gameScreen.classList.contains('active')) {
                    e.preventDefault();
                    toggleFullscreen();
                }
            });

            // ---------- SIDEBAR HOVER ----------
            const sidebar = document.querySelector('.sidebar');
            sidebar.addEventListener('mouseenter', function() {
                gameScreen.classList.add('sidebar-expanded');
            });
            sidebar.addEventListener('mouseleave', function() {
                gameScreen.classList.remove('sidebar-expanded');
            });

            // ---------- INIT ----------
            // Migrate old data to include category and description
            continueHistory = continueHistory.map(function(game) {
                const fullGame = getFullGameData(game);
                return {
                    name: fullGame.name,
                    url: fullGame.url,
                    category: fullGame.category,
                    description: fullGame.description
                };
            });
            setStorage('continue', continueHistory);

            favorites = favorites.map(function(game) {
                const fullGame = getFullGameData(game);
                return {
                    name: fullGame.name,
                    url: fullGame.url,
                    category: fullGame.category,
                    description: fullGame.description
                };
            });
            setStorage('favorites', favorites);

            renderAll();
            showSection('games');

            // Expose for debugging
            window.openGameScreen = openGameScreen;
            window.closeGameScreen = closeGameScreen;

        })();
    </script>
</body>
</html>
